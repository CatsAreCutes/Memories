<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow-x: hidden;
    }

    header {
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.7;
    }

    .create-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      flex-wrap: wrap;
    }

    input,
    button {
      font: inherit;
    }

    #memoryName {
      width: 280px;
      padding: 13px 15px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #1c1c1c;
      color: white;
      outline: none;
    }

    #memoryName:focus {
      border-color: #aaa;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    #tabs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .tab {
      min-height: 150px;
      border-radius: 16px;
      padding: 20px;
      background: #202020;
      border: 1px solid #444;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s;
    }

    .tab:hover {
      transform: translateY(-3px);
    }

    .tab h2 {
      position: relative;
      margin: 0;
      z-index: 2;
      word-break: break-word;
    }

    .tab-info {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      opacity: 0.7;
    }

    .tab::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--background);
      background-size: cover;
      background-position: center;
      opacity: 0.45;
    }

    .empty {
      text-align: center;
      opacity: 0.55;
      padding: 50px 20px;
    }

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #101010;
      z-index: 10;
      overflow-y: auto;
    }

    .viewer-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: rgba(15, 15, 15, 0.95);
      border-bottom: 1px solid #333;
    }

    .viewer-header h2 {
      margin: 0;
      word-break: break-word;
    }

    .viewer-content {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .files {
      display: grid;
      gap: 14px;
    }

    .file {
      padding: 16px;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      background: #1b1b1b;
    }

    .file-name {
      font-weight: bold;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .file img {
      max-width: 100%;
      max-height: 500px;
      display: block;
      border-radius: 8px;
    }

    .file video {
      width: 100%;
      max-height: 600px;
      border-radius: 8px;
    }

    .file audio {
      width: 100%;
    }

    .file a {
      color: white;
    }

    .locked {
      padding: 14px;
      border-radius: 10px;
      background: #191919;
      border: 1px solid #333;
      opacity: 0.75;
      margin-bottom: 20px;
    }

    #backgroundInput,
    #fileInput {
      display: none;
    }

    @media (max-width: 600px) {
      #tabs {
        grid-template-columns: 1fr;
      }

      #memoryName {
        width: 100%;
      }

      .create-area {
        padding: 18px;
      }
    }
  </style>

</head>

<body>

  <header>
    <h1>Memories</h1>
    <p>Make a little place for your projects, art, files, and memories.</p>
  </header>

  <section class="create-area">
    <input
      id="memoryName"
      type="text"
      maxlength="60"
      placeholder="Name your memory..."
    >

```
<button onclick="createMemory()">
  + Create Memory
</button>
```

  </section>

  <main id="tabs">
    <div class="empty">
      Loading memories...
    </div>
  </main>

  <section id="viewer">

```
<div class="viewer-header">
  <h2 id="viewerTitle">Memory</h2>

  <button onclick="closeMemory()">
    Close
  </button>
</div>

<div class="viewer-content">

  <div class="locked">
    🔒 This memory is permanent and cannot be edited or deleted.
  </div>

  <div class="actions">

    <button onclick="document.getElementById('fileInput').click()">
      Upload File
    </button>

    <button onclick="document.getElementById('backgroundInput').click()">
      Set Background
    </button>

  </div>

  <input
    id="fileInput"
    type="file"
    multiple
    onchange="uploadFiles(event)"
  >

  <input
    id="backgroundInput"
    type="file"
    accept="image/*"
    onchange="uploadBackground(event)"
  >

  <div id="files" class="files"></div>

</div>
```

  </section>

  <script>

    let currentMemory = null;

    async function loadMemories() {
      try {
        const response = await fetch("/api/memories");
        const data = await response.json();

        const tabs = document.getElementById("tabs");

        if (!data.memories || data.memories.length === 0) {
          tabs.innerHTML = `
            <div class="empty">
              No memories yet.<br>
              Create the first one!
            </div>
          `;
          return;
        }

        tabs.innerHTML = "";

        data.memories.forEach(memory => {
          const tab = document.createElement("div");

          tab.className = "tab";

          if (memory.background) {
            tab.style.setProperty(
              "--background",
              `url("${memory.background}")`
            );
          } else {
            tab.style.setProperty(
              "--background",
              "none"
            );
          }

          tab.innerHTML = `
            <h2>${escapeHTML(memory.name)}</h2>
            <div class="tab-info">
              ${memory.fileCount} file${memory.fileCount === 1 ? "" : "s"}
            </div>
          `;

          tab.onclick = () => openMemory(memory.id);

          tabs.appendChild(tab);
        });

      } catch (error) {
        console.error(error);

        document.getElementById("tabs").innerHTML = `
          <div class="empty">
            Couldn't load the memories.
          </div>
        `;
      }
    }

    async function createMemory() {
      const input = document.getElementById("memoryName");
      const name = input.value.trim();

      if (!name) {
        alert("Give your memory a name first!");
        return;
      }

      try {
        const response = await fetch("/api/memories", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name
          })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Couldn't create memory.");
          return;
        }

        input.value = "";

        await loadMemories();

        openMemory(data.memory.id);

      } catch (error) {
        console.error(error);
        alert("Couldn't create the memory.");
      }
    }

    async function openMemory(id) {
      try {
        const response =
          await fetch(`/api/memories/${encodeURIComponent(id)}`);

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Memory not found.");
          return;
        }

        currentMemory = data.memory;

        document.getElementById("viewerTitle").textContent =
          currentMemory.name;

        document.getElementById("viewer").style.display =
          "block";

        renderFiles();

      } catch (error) {
        console.error(error);
        alert("Couldn't open this memory.");
      }
    }

    function closeMemory() {
      document.getElementById("viewer").style.display =
        "none";

      currentMemory = null;
    }

    function renderFiles() {
      const container =
        document.getElementById("files");

      container.innerHTML = "";

      if (!currentMemory.files.length) {
        container.innerHTML = `
          <div class="empty">
            This memory doesn't have any files yet.
          </div>
        `;
        return;
      }

      currentMemory.files.forEach(file => {
        const element =
          document.createElement("div");

        element.className = "file";

        const name =
          document.createElement("div");

        name.className = "file-name";
        name.textContent = file.name;

        element.appendChild(name);

        if (file.type.startsWith("image/")) {

          const image =
            document.createElement("img");

          image.src = file.url;
          image.alt = file.name;

          element.appendChild(image);

        } else if (file.type.startsWith("video/")) {

          const video =
            document.createElement("video");

          video.src = file.url;
          video.controls = true;

          element.appendChild(video);

        } else if (file.type.startsWith("audio/")) {

          const audio =
            document.createElement("audio");

          audio.src = file.url;
          audio.controls = true;

          element.appendChild(audio);

        } else {

          const link =
            document.createElement("a");

          link.href = file.url;
          link.target = "_blank";
          link.textContent = "Open file";

          element.appendChild(link);
        }

        container.appendChild(element);
      });
    }

    async function uploadFiles(event) {
      if (!currentMemory) return;

      const files =
        Array.from(event.target.files);

      for (const file of files) {

        try {
          const data =
            await fileToDataURL(file);

          const response =
            await fetch(
              `/api/memories/${encodeURIComponent(currentMemory.id)}/file`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  filename: file.name,
                  mimeType: file.type,
                  data
                })
              }
            );

          const result =
            await response.json();

          if (!response.ok) {
            alert(
              result.error ||
              `Couldn't upload ${file.name}.`
            );
            continue;
          }

          currentMemory.files.push(
            result.file
          );

        } catch (error) {
          console.error(error);
          alert(
            `Couldn't upload ${file.name}.`
          );
        }
      }

      event.target.value = "";

      renderFiles();
      loadMemories();
    }

    async function uploadBackground(event) {
      if (!currentMemory) return;

      const file =
        event.target.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("The background must be an image.");
        event.target.value = "";
        return;
      }

      try {
        const data =
          await fileToDataURL(file);

        const response =
          await fetch(
            `/api/memories/${encodeURIComponent(currentMemory.id)}/background`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                filename: file.name,
                mimeType: file.type,
                data
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok) {
          alert(
            result.error ||
            "Couldn't set the background."
          );
          return;
        }

        currentMemory.background =
          result.background;

        alert("Background saved!");

        loadMemories();

      } catch (error) {
        console.error(error);
        alert("Couldn't set the background.");
      }

      event.target.value = "";
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload =
          () => resolve(reader.result);

        reader.onerror =
          reject;

        reader.readAsDataURL(file);
      });
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document
      .getElementById("memoryName")
      .addEventListener("keydown", event => {
        if (event.key === "Enter") {
          createMemory();
        }
      });

    loadMemories();

  </script>

</body>
</html>
