<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Memories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #09090d;
      --panel: #15151d;
      --panel2: #1d1d28;
      --border: rgba(255,255,255,.12);
      --text: #fff;
      --muted: #aaa;
      --accent: #8b7cff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #292044 0, #09090d 55%);
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 42px 20px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin-top: 10px;
      color: var(--muted);
    }

    .create-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      flex-wrap: wrap;
    }

    input,
    button {
      font: inherit;
    }

    #memoryName {
      width: min(420px, 90vw);
      padding: 15px 17px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      outline: none;
    }

    #memoryName:focus {
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 19px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    #tabs {
      width: min(1150px, 94vw);
      margin: 20px auto;
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .tab {
      min-height: 170px;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: .15s;
    }

    .tab:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,.3);
    }

    .tab::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        var(--background),
        linear-gradient(
          135deg,
          rgba(139,124,255,.35),
          transparent
        );
      background-size: cover;
      background-position: center;
      opacity: .5;
    }

    .tab > * {
      position: relative;
      z-index: 1;
    }

    .tab h2 {
      margin: 0;
      word-break: break-word;
    }

    .tab-info {
      margin-top: 12px;
      color: #ccc;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
    }

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow-y: auto;
      background:
        radial-gradient(
          circle at 20% 0%,
          #30275c,
          #101018 50%,
          #07070b
        );
    }

    .viewer-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 18px 22px;
      background: rgba(10,10,15,.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .viewer-header h2 {
      margin: 0;
      word-break: break-word;
    }

    .viewer-content {
      width: min(1050px, 94vw);
      margin: auto;
      padding: 30px 0 80px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .upload-status {
      margin: 15px 0;
      color: #c9c4ff;
      min-height: 20px;
    }

    .files {
      display: grid;
      gap: 18px;
    }

    .file {
      padding: 18px;
      border-radius: 18px;
      background: rgba(20,20,28,.9);
      border: 1px solid var(--border);
    }

    .file-name {
      font-weight: bold;
      margin-bottom: 14px;
      word-break: break-word;
    }

    .file img {
      max-width: 100%;
      max-height: 600px;
      display: block;
      border-radius: 12px;
    }

    .file video {
      width: 100%;
      max-height: 700px;
      display: block;
      border-radius: 12px;
      background: black;
    }

    .file audio {
      width: 100%;
    }

    .file a {
      color: white;
    }

    #fileInput,
    #backgroundInput {
      display: none;
    }

    .viewer-note {
      margin-bottom: 22px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(139,124,255,.1);
      border: 1px solid rgba(139,124,255,.25);
      color: #d9d4ff;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 34px;
      }

      #tabs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Memories</h1>
  <p>Your projects, art, videos, files, and memories.</p>
</header>

<section class="create-area">
  <input
    id="memoryName"
    type="text"
    maxlength="60"
    placeholder="Name your memory..."
  >

  <button onclick="createMemory()">
    + Create Memory
  </button>
</section>

<main id="tabs">
  <div class="empty">Loading memories...</div>
</main>

<section id="viewer">

  <div class="viewer-header">
    <h2 id="viewerTitle">Memory</h2>

    <button onclick="closeMemory()">
      Close
    </button>
  </div>

  <div class="viewer-content">

    <div class="viewer-note">
      Files are stored separately from the website, so large
      videos don't have to pass through the Render server.
    </div>

    <div class="actions">

      <button
        onclick="document.getElementById('fileInput').click()"
      >
        Upload File / Video
      </button>

      <button
        onclick="document.getElementById('backgroundInput').click()"
      >
        Set Memory Background
      </button>

    </div>

    <input
      id="fileInput"
      type="file"
      multiple
      onchange="uploadFiles(event)"
    >

    <input
      id="backgroundInput"
      type="file"
      accept="image/*"
      onchange="uploadBackground(event)"
    >

    <div id="uploadStatus"
         class="upload-status"></div>

    <div id="files" class="files"></div>

  </div>
</section>

<script>

let currentMemory = null;


async function loadMemories() {

  try {

    const response =
      await fetch("/api/memories");

    const data =
      await response.json();

    const tabs =
      document.getElementById("tabs");

    if (!response.ok) {
      throw new Error(
        data.error || "Couldn't load memories."
      );
    }

    if (!data.memories.length) {

      tabs.innerHTML = `
        <div class="empty">
          No memories yet.<br>
          Create the first one!
        </div>
      `;

      return;
    }

    tabs.innerHTML = "";

    data.memories.forEach(memory => {

      const tab =
        document.createElement("div");

      tab.className = "tab";

      tab.style.setProperty(
        "--background",
        memory.background
          ? `url("${memory.background}")`
          : "none"
      );

      const title =
        document.createElement("h2");

      title.textContent =
        memory.name;

      const info =
        document.createElement("div");

      info.className = "tab-info";

      info.textContent =
        `${memory.fileCount} file` +
        (memory.fileCount === 1 ? "" : "s");

      tab.appendChild(title);
      tab.appendChild(info);

      tab.onclick = () =>
        openMemory(memory.id);

      tabs.appendChild(tab);
    });

  } catch (error) {

    console.error(error);

    document.getElementById("tabs").innerHTML = `
      <div class="empty">
        Couldn't load memories.
      </div>
    `;
  }
}


async function createMemory() {

  const input =
    document.getElementById("memoryName");

  const name =
    input.value.trim();

  if (!name) {
    alert("Give your memory a name first!");
    return;
  }

  try {

    const response =
      await fetch("/api/memories", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ name })
      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Couldn't create memory."
      );
    }

    input.value = "";

    await loadMemories();

    openMemory(data.memory.id);

  } catch (error) {

    console.error(error);

    alert(error.message);
  }
}


async function openMemory(id) {

  try {

    const response =
      await fetch(
        `/api/memories/${encodeURIComponent(id)}`
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Memory not found."
      );
    }

    currentMemory =
      data.memory;

    document.getElementById(
      "viewerTitle"
    ).textContent =
      currentMemory.name;

    document.getElementById(
      "viewer"
    ).style.display =
      "block";

    renderFiles();

  } catch (error) {

    console.error(error);

    alert(error.message);
  }
}


function closeMemory() {

  document.getElementById(
    "viewer"
  ).style.display =
    "none";

  currentMemory = null;
}


function renderFiles() {

  const container =
    document.getElementById("files");

  container.innerHTML = "";

  if (!currentMemory.files.length) {

    container.innerHTML = `
      <div class="empty">
        This memory doesn't have any files yet.
      </div>
    `;

    return;
  }

  currentMemory.files.forEach(file => {

    const element =
      document.createElement("div");

    element.className = "file";

    const name =
      document.createElement("div");

    name.className = "file-name";

    name.textContent =
      file.name;

    element.appendChild(name);

    if (file.type.startsWith("image/")) {

      const image =
        document.createElement("img");

      image.src =
        file.url;

      image.alt =
        file.name;

      element.appendChild(image);

    } else if (file.type.startsWith("video/")) {

      const video =
        document.createElement("video");

      video.src =
        file.url;

      video.controls = true;
      video.playsInline = true;

      element.appendChild(video);

    } else if (file.type.startsWith("audio/")) {

      const audio =
        document.createElement("audio");

      audio.src =
        file.url;

      audio.controls = true;

      element.appendChild(audio);

    } else {

      const link =
        document.createElement("a");

      link.href =
        file.url;

      link.target =
        "_blank";

      link.textContent =
        "Open file";

      element.appendChild(link);
    }

    container.appendChild(element);
  });
}


async function uploadFiles(event) {

  if (!currentMemory) return;

  const selectedFiles =
    Array.from(event.target.files);

  event.target.value = "";

  if (!selectedFiles.length) return;

  const status =
    document.getElementById("uploadStatus");

  for (const file of selectedFiles) {

    try {

      status.textContent =
        `Preparing ${file.name}...`;

      const urlResponse =
        await fetch(
          `/api/memories/${encodeURIComponent(
            currentMemory.id
          )}/upload-url`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              filename: file.name,
              mimeType:
                file.type ||
                "application/octet-stream"
            })
          }
        );

      const urlData =
        await urlResponse.json();

      if (!urlResponse.ok) {
        throw new Error(
          urlData.error ||
          "Couldn't prepare upload."
        );
      }

      status.textContent =
        `Uploading ${file.name}...`;

      const uploadResponse =
        await fetch(
          urlData.uploadUrl,
          {
            method: "PUT",
            headers: {
              "Content-Type":
                file.type ||
                "application/octet-stream"
            },
            body: file
          }
        );

      if (!uploadResponse.ok) {
        throw new Error(
          `Storage upload failed (${uploadResponse.status}).`
        );
      }

      const saveResponse =
        await fetch(
          `/api/memories/${encodeURIComponent(
            currentMemory.id
          )}/file`,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              name: file.name,
              type:
                file.type ||
                "application/octet-stream",
              key: urlData.key
            })
          }
        );

      const saveData =
        await saveResponse.json();

      if (!saveResponse.ok) {
        throw new Error(
          saveData.error ||
          "Couldn't save file information."
        );
      }

      currentMemory.files.push(
        saveData.file
      );

      renderFiles();

      await loadMemories();

      status.textContent =
        `${file.name} uploaded successfully.`;

    } catch (error) {

      console.error(error);

      status.textContent =
        `Couldn't upload ${file.name}: ${error.message}`;
    }
  }

  setTimeout(() => {
    status.textContent = "";
  }, 4000);
}


async function uploadBackground(event) {

  if (!currentMemory) return;

  const file =
    event.target.files[0];

  event.target.value = "";

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("The background must be an image.");
    return;
  }

  const status =
    document.getElementById("uploadStatus");

  try {

    status.textContent =
      "Uploading background...";

    const response =
      await fetch(
        `/api/memories/${encodeURIComponent(
          currentMemory.id
        )}/background-url`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            filename: file.name,
            mimeType: file.type
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Couldn't prepare background upload."
      );
    }

    const upload =
      await fetch(
        data.uploadUrl,
        {
          method: "PUT",
          headers: {
            "Content-Type":
              file.type
          },
          body: file
        }
      );

    if (!upload.ok) {
      throw new Error(
        `Storage upload failed (${upload.status}).`
      );
    }

    const save =
      await fetch(
        `/api/memories/${encodeURIComponent(
          currentMemory.id
        )}/background`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            key: data.key
          })
        }
      );

    const saveData =
      await save.json();

    if (!save.ok) {
      throw new Error(
        saveData.error ||
        "Couldn't save background."
      );
    }

    currentMemory.background =
      saveData.background;

    await loadMemories();

    status.textContent =
      "Background saved!";

  } catch (error) {

    console.error(error);

    status.textContent =
      `Couldn't set background: ${error.message}`;
  }

  setTimeout(() => {
    status.textContent = "";
  }, 4000);
}


document
  .getElementById("memoryName")
  .addEventListener(
    "keydown",
    event => {
      if (event.key === "Enter") {
        createMemory();
      }
    }
  );


loadMemories();

</script>

</body>
</html>
