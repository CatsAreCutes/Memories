```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #1b1b1b;
      border-bottom: 2px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #aaa;
    }

    #createArea {
      padding: 25px;
      text-align: center;
    }

    #createTabButton {
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    #createTabButton:hover {
      transform: scale(1.03);
    }

    #tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      padding: 25px;
      justify-content: center;
    }

    .tab {
      position: relative;
      width: 280px;
      min-height: 190px;
      padding: 20px;
      border-radius: 18px;
      overflow: hidden;
      background: #222;
      border: 2px solid #444;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .tabBackground {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      z-index: 0;
    }

    .tabContent {
      position: relative;
      z-index: 1;
    }

    .tab h2 {
      margin: 0 0 8px;
      word-break: break-word;
    }

    .locked {
      display: inline-block;
      margin-bottom: 15px;
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #ddd;
      font-size: 12px;
    }

    .fileList {
      margin-top: 10px;
      padding: 0;
      list-style: none;
    }

    .fileList li {
      margin: 6px 0;
      padding: 7px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.45);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fileList a {
      color: white;
      text-decoration: none;
    }

    .empty {
      width: 100%;
      text-align: center;
      color: #777;
      padding: 50px 20px;
    }

    dialog {
      width: min(500px, 90vw);
      border: 0;

      padding: 25px;
      background: #222;
      color: white;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
    }

    dialog h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      color: #ccc;

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid #555;
      background: #111;

    }

    .dialogButtons {
      display: flex;

      margin-top: 22px;

    .dialogButtons button {
      flex: 1;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    #cancelButton {
      background: #444;
      color: white;
    }

    #saveButton {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐈 Memories</h1>
    <p>Make a little place for your projects, art, music, videos, and memories.</p>
  </header>

  <main>

    <div id="createArea">
      <button id="createTabButton">
        + Create a Memory Tab
      </button>
    </div>

    <section id="tabs">
      <div class="empty" id="emptyMessage">
        No memory tabs yet.<br>
        Create one!
      </div>
    </section>

  </main>

  <dialog id="createDialog">

    <h2>Create a Memory Tab</h2>

    <label for="tabName">
      Tab name
    </label>

    <input
      id="tabName"
      type="text"
      maxlength="80"
      placeholder="My Art Project"
      autocomplete="off"
    >

    <label for="background">
      Custom background
    </label>

    <input
      id="background"
      type="file"
      accept="image/png,image/jpeg,image/webp,image/gif"
    >

    <label for="files">
      Files for this memory
    </label>

    <input
      id="files"
      type="file"
      multiple
      accept="image/*,audio/*,video/*,.zip,.rar,.7z,.txt,.pdf,.json,.js,.html,.css"
    >

    <div class="dialogButtons">

      <button
        id="cancelButton"
        type="button"
      >
        Cancel
      </button>

      <button
        id="saveButton"
        type="button"
      >
        Create Tab
      </button>

    </div>

  </dialog>

  <script>
    const createButton =
      document.getElementById("createTabButton");

    const dialog =
      document.getElementById("createDialog");

    const cancelButton =
      document.getElementById("cancelButton");

    const saveButton =
      document.getElementById("saveButton");

    const tabName =
      document.getElementById("tabName");

    const background =
      document.getElementById("background");

    const filesInput =
      document.getElementById("files");

    const tabs =
      document.getElementById("tabs");

    const emptyMessage =
      document.getElementById("emptyMessage");


    createButton.addEventListener(
      "click",
      () => {
        tabName.value = "";
        background.value = "";
        filesInput.value = "";

        dialog.showModal();
        tabName.focus();
      }
    );


    cancelButton.addEventListener(
      "click",
      () => {
        dialog.close();
      }
    );


    saveButton.addEventListener(
      "click",
      async () => {

        const name =
          tabName.value.trim();

        if (!name) {
          alert("Please give your memory a name!");
          tabName.focus();
          return;
        }

        let backgroundData = null;

        if (background.files.length > 0) {

          backgroundData =
            await fileToDataURL(
              background.files[0]
            );
        }

        const uploadedFiles = [];

        for (
          const file of filesInput.files
        ) {

          const data =
            await fileToDataURL(file);

          uploadedFiles.push({
            name: file.name,
            type: file.type,
            size: file.size,
            data: data
          });
        }

        const memory = {
          id:
            crypto.randomUUID(),

          name:
            name,

          background:
            backgroundData,

          files:
            uploadedFiles,

          createdAt:
            new Date().toISOString(),

          locked:
            true
        };

        createMemoryTab(memory);

        dialog.close();
      }
    );


    function fileToDataURL(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload =
            () => resolve(
              reader.result
            );

          reader.onerror =
            reject;

          reader.readAsDataURL(file);
        }
      );
    }


    function createMemoryTab(memory) {

      if (emptyMessage) {
        emptyMessage.remove();
      }

      const tab =
        document.createElement("article");

      tab.className = "tab";

      const tabBackground =
        document.createElement("div");

      tabBackground.className =
        "tabBackground";

      if (memory.background) {

        tabBackground.style.backgroundImage =
          `url("${memory.background}")`;
      }

      const content =
        document.createElement("div");

      content.className =
        "tabContent";

      const title =
        document.createElement("h2");

      title.textContent =
        memory.name;

      const locked =
        document.createElement("div");

      locked.className =
        "locked";

      locked.textContent =
        "🔒 Permanent / Locked";

      const fileList =
        document.createElement("ul");

      fileList.className =
        "fileList";

      if (
        memory.files.length === 0
      ) {

        const item =
          document.createElement("li");

        item.textContent =
          "No files uploaded.";

        fileList.appendChild(item);

      } else {

        memory.files.forEach(
          file => {

            const item =
              document.createElement("li");

            const link =
              document.createElement("a");

            link.href =
              file.data;

            link.download =
              file.name;

            link.textContent =
              "📄 " + file.name;

            item.appendChild(link);

            fileList.appendChild(item);
          }
        );
      }

      content.appendChild(title);
      content.appendChild(locked);
      content.appendChild(fileList);

      tab.appendChild(tabBackground);
      tab.appendChild(content);

      tabs.appendChild(tab);
    }

  </script>

</body>
</html>
