<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Memories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #090a0f;
      --panel: #14161e;
      --panel2: #1b1e29;
      --border: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: #9da3b5;
      --accent: #8b7cff;
      --accent2: #5ee7ff;
      --danger: #ff5f6d;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .hero {
      padding: 42px 20px 30px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(139,124,255,.25), transparent 55%),
        #0c0d13;
      border-bottom: 1px solid var(--border);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      letter-spacing: -2px;
    }

    .hero p {
      margin: 10px auto 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 16px;
    }

    .create-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 24px 18px;
      flex-wrap: wrap;
    }

    #memoryName {
      width: min(420px, 90vw);
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline: none;
      background: var(--panel);
      color: white;
    }

    #memoryName:focus {
      border-color: var(--accent);
    }

    .primary {
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      font-weight: bold;
    }

    .primary:hover {
      filter: brightness(1.1);
    }

    #tabs {
      width: min(1200px, 100%);
      margin: auto;
      padding: 10px 18px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .tab {
      min-height: 170px;
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      cursor: pointer;
      transition: transform .15s, border-color .15s;
      isolation: isolate;
    }

    .tab:hover {
      transform: translateY(-4px);
      border-color: rgba(139,124,255,.5);
    }

    .tab::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: var(--background);
      background-size: cover;
      background-position: center;
      opacity: .32;
    }

    .tab::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.75)
      );
    }

    .tab h2 {
      margin: 0;
      font-size: 23px;
      word-break: break-word;
    }

    .tab-info {
      margin-top: 14px;
      color: var(--muted);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
    }

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow-y: auto;
      background:
        radial-gradient(circle at 50% -10%, rgba(139,124,255,.18), transparent 45%),
        #08090d;
    }

    .viewer-header {
      position: sticky;
      top: 0;
      z-index: 110;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px 20px;
      background: rgba(8,9,13,.92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .viewer-header h2 {
      margin: 0;
      font-size: clamp(20px, 4vw, 32px);
      word-break: break-word;
    }

    .close-button {
      padding: 13px 18px;
      border-radius: 12px;
      background: #252936;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .viewer-content {
      width: min(1100px, 100%);
      margin: auto;
      padding: 24px 18px 70px;
    }

    .notice {
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .action {
      padding: 14px 18px;
      border-radius: 13px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: white;
      font-weight: bold;
    }

    .action:hover {
      border-color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    .files {
      display: grid;
      gap: 18px;
    }

    .file {
      padding: 18px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .file-name {
      margin-bottom: 12px;
      font-weight: bold;
      word-break: break-word;
    }

    .file-meta {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .file img,
    .file video {
      display: block;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
      background: black;
    }

    .file audio {
      width: 100%;
    }

    .file a {
      display: inline-block;
      padding: 12px 15px;
      border-radius: 10px;
      background: #252936;
      color: white;
      text-decoration: none;
    }

    .delete-file {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 10px;
      background: rgba(255,95,109,.12);
      color: #ff8c96;
    }

    .storage {
      margin-top: 25px;
      padding: 15px;
      border-radius: 14px;
      background: #101219;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 650px) {
      #tabs {
        grid-template-columns: 1fr;
      }

      .create-area {
        flex-direction: column;
        align-items: stretch;
      }

      #memoryName {
        width: 100%;
      }

      .primary {
        width: 100%;
      }

      .viewer-header {
        padding: 13px;
      }

      .viewer-content {
        padding: 18px 13px 50px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <h1>Memories</h1>
    <p>
      Your little place for projects, art, videos, music, and files.
    </p>
  </header>

  <section class="create-area">
    <input
      id="memoryName"
      type="text"
      maxlength="60"
      placeholder="Name your memory..."
      autocomplete="off"
    >

    <button class="primary" id="createButton">
      + Create Memory
    </button>
  </section>

  <main id="tabs">
    <div class="empty">
      Loading memories...
    </div>
  </main>

  <section id="viewer">

    <div class="viewer-header">
      <h2 id="viewerTitle">Memory</h2>

      <button class="close-button" id="closeButton">
        Close
      </button>
    </div>

    <div class="viewer-content">

      <div class="notice">
        Files are stored in this browser's local storage database.
        This version does not require a server-side file system.
      </div>

      <div class="actions">

        <button class="action" id="uploadButton">
          Upload Files
        </button>

        <button class="action" id="backgroundButton">
          Set Viewer Background
        </button>

        <input
          id="fileInput"
          type="file"
          multiple
        >

        <input
          id="backgroundInput"
          type="file"
          accept="image/*"
        >

      </div>

      <div id="files" class="files"></div>

      <div id="storageInfo" class="storage">
        Storage: calculating...
      </div>

    </div>

  </section>

  <script src="workings.js"></script>

</body>
</html>
